            PersonSearch:
              addPerson: add person
              all: All
              birthdate: Birthdate
              columns: Columns
              delete: Delete
              deleteHeader: Delete?
              deleteMessage: Do you really want to the delete person ''{0} {1}''?
              departmentName: Department
              edit: Edit
              firstName: Firstname
              info: |-
                <h3>Search</h3>
                <ul>
                  <li>All fields search for exact matches; the salary field matches values greater than or equal to the entered value.</li>
                  <li>Search is lazy and returns results as you type.</li>
                  <li>Results are restricted to persons within your own department. Administrators can search across all departments.</li>
                </ul>

                <h3>Validation</h3>
                <p>Saving triggers both errors and warnings:</p>
                <ul>
                  <li>Hard errors must be resolved before saving.</li>
                  <li>Warnings can be accepted by choosing <b>"Save anyway"</b>.</li>
                </ul>

                <h3>Class-level checks:</h3>
                <ul>
                  <li>A warning is shown if the Ivy username does not follow the format <code>firstname.lastname</code>.</li>
                  <li>An error is shown if the Ivy username is already in use, including by deleted users.</li>
                </ul>
              infoHeader: Personsearch, Features
