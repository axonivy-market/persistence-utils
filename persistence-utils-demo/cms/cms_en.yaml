              info: |-
                <h3>Search</h3>
                <ul>
                  <li>Search is non-lazy and loads all departments upfront using <code>findAll()</code>.</li>
                  <li>Results include complete Department objects, including logically deleted departments.</li>
                </ul>

                <h3>Validation</h3>
                <ul>
                  <li>Creating a department with a name that already exists intentionally triggers a fatal error (via an exception) to demonstrate system-level error handling.</li>
                </ul>
              infoHeader: Departmentsearch, Features
